server:
  port: 8082

spring:
  application:
    name: patient-service

  datasource:
    url: jdbc:mysql://localhost:3306/healthcare_patient_db
    username: root
    password: Malli@160902

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

  health:
    redis:
      enabled: false